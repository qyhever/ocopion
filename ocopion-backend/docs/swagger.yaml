basePath: /api
definitions:
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8301
info:
  contact: {}
  description: ocopion-backend HTTP API documentation.
  title: ocopion-backend API
  version: "1.0"
paths:
  /meta:
    get:
      consumes:
      - application/json
      description: 返回 public/meta.json 中的动态 JSON 内容；文件缺失时返回 deployTime=unknown。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取部署元信息
      tags:
      - meta
  /video:
    get:
      consumes:
      - application/json
      description: 获取当前视频配置列表。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取视频配置列表
      tags:
      - video
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
