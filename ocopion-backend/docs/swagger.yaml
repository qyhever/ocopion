basePath: /api
definitions:
  cloudflare.SpeedTestResult:
    properties:
      ips:
        items:
          type: string
        type: array
    type: object
  cloudflare.Task:
    properties:
      error:
        type: string
      finished_at:
        type: string
      ips:
        items:
          type: string
        type: array
      started_at:
        type: string
      status:
        enum:
        - idle
        - running
        - succeeded
        - failed
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8301
info:
  contact: {}
  description: ocopion-backend HTTP API documentation.
  title: ocopion-backend API
  version: "1.0"
paths:
  /cloudflare/fast-ip:
    get:
      description: 状态为 idle/running/succeeded/failed；时间为 RFC3339，未发生时为 null。任务失败仍返回成功封装。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cloudflare.Task'
              type: object
      summary: 查询最近一次 Cloudflare 优选任务
      tags:
      - cloudflare
    post:
      description: 无请求体；后台执行，运行期间重复调用返回同一任务。优选 16 个 IP 后从模板新增 US/KR 共 32 个节点，依次保存
        IP 文本和 Clash 配置，然后按配置上传文件，上传成功后才成功。上传失败保留本地文件。模板异常不更新文件；Clash 保存失败时 IP 文本可能已更新，旧
        Clash 文件保留。失败原因通过任务 error 返回。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cloudflare.Task'
              type: object
      summary: 启动 Cloudflare IPv4 最低延迟优选
      tags:
      - cloudflare
  /cloudflare/speed-test:
    post:
      description: 无请求体；最长等待 10 分钟，返回平均延迟不超过 200ms 的 12 个去重 IPv4，不保存文件或更新后台任务。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cloudflare.SpeedTestResult'
              type: object
      summary: 同步 Cloudflare IPv4 测速
      tags:
      - cloudflare
  /meta:
    get:
      consumes:
      - application/json
      description: 返回 public/meta.json 中的动态 JSON 内容；文件缺失时返回 deployTime=unknown。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取部署元信息
      tags:
      - meta
  /video:
    get:
      consumes:
      - application/json
      description: 获取当前视频配置列表。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取视频配置列表
      tags:
      - video
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
