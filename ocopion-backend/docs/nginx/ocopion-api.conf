# 宿主机：/opt/pros/nginx/conf.d/locations/ocopion-api.conf
# exact location 优先于原有 ^~ 前缀，测速设置只作用于以下四个接口。
location = /ocopion/api/info {
    proxy_pass http://127.0.0.1:8301/api/info;
    include /usr/local/openresty/nginx/conf/conf.d/snippets/ocopion-speedtest-proxy.conf;
}

location = /ocopion/api/echo {
    proxy_pass http://127.0.0.1:8301/api/echo;
    include /usr/local/openresty/nginx/conf/conf.d/snippets/ocopion-speedtest-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location = /ocopion/api/download {
    proxy_pass http://127.0.0.1:8301/api/download;
    include /usr/local/openresty/nginx/conf/conf.d/snippets/ocopion-speedtest-proxy.conf;
}

location = /ocopion/api/upload {
    proxy_pass http://127.0.0.1:8301/api/upload;
    include /usr/local/openresty/nginx/conf/conf.d/snippets/ocopion-speedtest-proxy.conf;
}

# 其他 API 沿用现有代理配置。
location ^~ /ocopion/api/ {
    proxy_pass http://127.0.0.1:8301/api/;
    include /usr/local/openresty/nginx/conf/proxy_headers.conf;
}
