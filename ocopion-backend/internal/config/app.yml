mode: "dev"

file:
  upload_view_base_url: ""
  upload_dir_path: ""

server:
  port: 8301
  trusted_proxies: [] # 仅填写实际反向代理的 IP/CIDR，默认不信任转发头

logger:
  level: "debug"
  filename: "./log/ocopion.log"
  max_size: 100 # 单文件最大体积，单位 MB
  max_age: 30 # 历史日志最大保留天数，单位 day
  max_backups: 5

database:
  mysql:
    addr: "localhost:3306"
    user: "root"
    password: "123456"
    db_name: "ocopion"

jwt:
  secret: "foobar"
  access_expires_in: "2h"
  refresh_expires_in: "72h"

auth:
  whitelist:
    - "GET:/foo"
    - "GET:/@vite/client"
    - "GET:/"
    - "POST:/app/getHelloInfo"

postal:
  smtp_server: "" # SMTP服务器地址
  smtp_port: ""  # SMTP端口(优先465)
  from_email: "" # 发件邮箱
  from_pass: ""  # 发件邮箱密码
  from_name: ""  # 发件人显示名称

attach:
  view_attach_base_url: "http://localhost:8301/public/uploads" # 上传文件访问地址前缀
  upload_dir_path: "./public/uploads" # 上传文件存放目录
  view_large_file_base_url: "http://localhost:8301/public/larges" # 大文件访问地址前缀
  upload_large_file_path: "./public/larges" # 大文件存放目录
  chunk_dir_path: "./public/chunks" # 分片文件存放目录
  chunk_dir_salt: "ocopion_chunk_upload_salt"
  txt_video_dir_path: "./public/txt-videos" # 文本转视频文件存放目录

tg:
  mirror_base_url: "" # TG机器人镜像地址
  bot_token: "" # TG机器人Token
  chat_id: ""   # TG聊天ID

# cfst 与 IPv4 网段文件 ip.txt 由部署方安装在同一目录
cfst_bin_path: ""
output_fast_ip_path: "./fast-ip.txt"
cfst_url: ""
clash_template_path: "./tmp/template.yaml"
output_clash_path: "./public/kdd.yaml"
upload_config_file_url: "http://localhost:8301/app/uploadConfigFile"
upload_config_file_secret: "hi"

speedtest:
  node_name: "当前 VPS"
  allowed_origins: [] # 默认允许同源；跨域前端需填写完整 Origin
